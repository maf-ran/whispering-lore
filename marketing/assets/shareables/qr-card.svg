<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0D0D"/>
      <stop offset="100%" stop-color="#1C1917"/>
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="800" height="800" rx="24" fill="url(#card-bg)" stroke="#292524" stroke-width="2"/>
  <rect x="30" y="30" width="740" height="740" rx="16" fill="none" stroke="#E05C5C" stroke-width="1" opacity="0.3"/>
  
  <!-- Header / Logo Mark -->
  <path d="M400,90 L415,115 L400,140 L385,115 Z" fill="#E05C5C"/>
  <text x="400" y="180" font-family="'Cinzel', serif" font-size="28" font-weight="700" fill="#D6D3C8" text-anchor="middle" letter-spacing="0.25em">WHISPERING LORE</text>
  <text x="400" y="210" font-family="'Lora', serif" font-size="16" font-style="italic" fill="#A8A29E" text-anchor="middle">Scan to enter the archive</text>
  <line x1="300" y1="240" x2="500" y2="240" stroke="#E05C5C" stroke-width="1" opacity="0.5"/>

  <!-- QR Code Stylized Placeholder Frame -->
  <rect x="250" y="280" width="300" height="300" rx="12" fill="#050505" stroke="#292524" stroke-width="2"/>
  <!-- Corner squares of QR code -->
  <rect x="280" y="310" width="70" height="70" rx="6" fill="none" stroke="#D6D3C8" stroke-width="8"/>
  <rect x="300" y="330" width="30" height="30" fill="#E05C5C"/>
  
  <rect x="450" y="310" width="70" height="70" rx="6" fill="none" stroke="#D6D3C8" stroke-width="8"/>
  <rect x="470" y="330" width="30" height="30" fill="#E05C5C"/>

  <rect x="280" y="480" width="70" height="70" rx="6" fill="none" stroke="#D6D3C8" stroke-width="8"/>
  <rect x="300" y="500" width="30" height="30" fill="#E05C5C"/>

  <!-- Random data dots simulation inside QR -->
  <circle cx="390" cy="340" r="6" fill="#D6D3C8"/>
  <circle cx="410" cy="360" r="6" fill="#D6D3C8"/>
  <circle cx="380" cy="400" r="6" fill="#E05C5C"/>
  <circle cx="420" cy="420" r="6" fill="#D6D3C8"/>
  <circle cx="390" cy="450" r="6" fill="#D6D3C8"/>
  <circle cx="500" cy="410" r="6" fill="#E05C5C"/>
  <circle cx="480" cy="470" r="6" fill="#D6D3C8"/>
  <circle cx="510" cy="500" r="6" fill="#D6D3C8"/>
  <circle cx="440" cy="510" r="6" fill="#E05C5C"/>
  <circle cx="460" cy="540" r="6" fill="#D6D3C8"/>
  <circle cx="380" cy="530" r="6" fill="#D6D3C8"/>

  <!-- Footer link -->
  <text x="400" y="635" font-family="'Cinzel', serif" font-size="15" fill="#E05C5C" text-anchor="middle" letter-spacing="0.15em">WHISPERINGLORE.COM</text>
  <text x="400" y="710" font-family="'Lora', serif" font-size="13" fill="#A8A29E" text-anchor="middle">3,672 Creatures · 2,185 Stories · 212 Countries</text>
</svg>
