<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <style>
      .sticker-label { font-family: 'Cinzel', serif; font-size: 14px; fill: #D6D3C8; letter-spacing: 0.15em; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1000" height="1000" fill="#0D0D0D"/>
  
  <!-- Grid layout for stickers -->
  <!-- Sticker 1: Circular Badge -->
  <g transform="translate(250, 250)">
    <circle cx="0" cy="0" r="150" fill="#1C1917" stroke="#E05C5C" stroke-width="4"/>
    <circle cx="0" cy="0" r="135" fill="none" stroke="#292524" stroke-width="2"/>
    <path d="M0,-50 L18,-15 L50,-15 L24,5 L35,38 L0,18 L-35,38 L-24,5 L-50,-15 L-18,-15 Z" fill="#E05C5C"/>
    <text x="0" y="85" class="sticker-label">WHISPERING LORE</text>
    <text x="0" y="110" font-family="'Lora', serif" font-size="10" font-style="italic" fill="#A8A29E" text-anchor="middle">EST. 2026</text>
  </g>

  <!-- Sticker 2: Crest / Shield -->
  <g transform="translate(750, 250)">
    <path d="M0,-140 C80,-140 120,-80 120,0 C120,80 60,140 0,160 C-60,140 -120,80 -120,0 C-120,-80 -80,-140 0,-140 Z" fill="#1C1917" stroke="#D6D3C8" stroke-width="3"/>
    <path d="M0,-120 C70,-120 100,-70 100,0 C100,70 50,120 0,135 C-50,120 -100,70 -100,0 C-100,-70 -70,-120 0,-120 Z" fill="#050505" stroke="#E05C5C" stroke-width="1.5"/>
    <path d="M0,-40 L15,-10 L40,-10 L20,10 L28,35 L0,20 L-28,35 L-20,10 L-40,-10 L-15,-10 Z" fill="#E05C5C"/>
    <text x="0" y="85" class="sticker-label">ARCHIVE</text>
  </g>

  <!-- Sticker 3: Hexagonal Rune Badge -->
  <g transform="translate(250, 750)">
    <polygon points="0,-140 121,-70 121,70 0,140 -121,70 -121,-70" fill="#1C1917" stroke="#E05C5C" stroke-width="3"/>
    <path d="M0,-30 L20,0 L0,30 L-20,0 Z" fill="#D6D3C8"/>
    <text x="0" y="80" class="sticker-label">MYTH &amp; LORE</text>
  </g>

  <!-- Sticker 4: Minimalist Wordmark Badge -->
  <g transform="translate(750, 750)">
    <rect x="-160" y="-80" width="320" height="160" rx="16" fill="#1C1917" stroke="#292524" stroke-width="3"/>
    <rect x="-145" y="-65" width="290" height="130" rx="10" fill="none" stroke="#E05C5C" stroke-width="1" opacity="0.5"/>
    <path d="M0,-35 L10,-18 L0,-1 L-10,-18 Z" fill="#E05C5C"/>
    <text x="0" y="25" class="sticker-label">WHISPERING LORE</text>
  </g>
</svg>
